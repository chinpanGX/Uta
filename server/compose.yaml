services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: uta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?server/.env に POSTGRES_PASSWORD を書く}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - uta-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uta"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  uta-postgres:
